function pick(p,k){const g=p.gm==='table',a=g?S.seat:S.pool,o=[];while(k--&&a.length)o.push({t:g?'s':'g',v:a.splice(Math.random()*a.length|0,1)[0]});return o}

function sp(el,box,max,fin,ms){box.classList.add('spin');box.classList.remove('done');return new Promise(r=>{const t0=performance.now();let last=0;(function f(now){const q=(now-t0)/ms;if(q>=1){el.textContent=fin;box.classList.remove('spin');box.classList.add('done');SF.land();return r()}if(now-last>40+q*q*200){last=now;el.textContent=Array.isArray(max)?max[Math.random()*max.length|0]:1+(Math.random()*max|0);SF.tick()}requestAnimationFrame(f)})(t0)})}
async function spin(ws,p){const cvm=C.mode==='csv',tb=R2(p),mT=cvm?[...new Set(C.roster.map(r=>r.u))]:C.tables,mS=cvm?C.roster.map(r=>r.n):C.mode==='table'?C.seats:C.total,cards=ws.length>1||$('.stage').classList.contains('bm'),fn=w=>cvm?(r=>[r.u,r.n])(rost(w)):tb?String(w.v).split('-'):[w.v];
if(cards){const m=$('#multi');m.className='multi on';m.innerHTML=ws.map((w,i)=>`<div class="mc"><small>第 ${i+1} 位</small>${cvm?'<span class="u">-</span><span>-</span>':tb?'<span>0</span>桌<span>0</span>號':p.gm==='table'?'全場 <span>0</span> 號':'<span>0</span>號'}</div>`).join('');
await Promise.all([...m.querySelectorAll('.mc')].flatMap((c,i)=>[...c.querySelectorAll('span')].map((s,j)=>sp(s,c,tb&&j===0?mT:mS,fn(ws[i])[j],tb&&j===1?5000:4000))))}
else{const f=fn(ws[0]);await Promise.all([...(tb?[sp($('#nT'),$('#rT'),mT,f[0],4000)]:[]),sp($('#nS'),$('#rS'),mS,f[tb?1:0],tb?5000:4000)])}
await sl(1500)}

function popup(p,ws){return new Promise(r=>{const tb=p.gm==='table';
const nw=ws.length,cols=nw<=5?nw:Math.ceil(nw/2),cp=Math.min(nw,2);
M(`<div class="pop w"><div class="gz">恭喜中獎</div><div class="tag"><b>${esc(p.no)}</b>${p.si<0?'':'　'+esc(p.pn)+((p.gift||'').trim()?(C.prov?'提供':'　')+esc(p.gift.trim()):'')}　共 ${ws.length} 位</div><div class="rows" style="--c:${cols};--cp:${cp}">${ws.map((w,i)=>`<label class="wrow${C.mode==='csv'?' cv':''}">${C.mode==='csv'?(r=>`<div class="un">${esc(r.u)}</div><b>${esc(r.n)}</b>`)(rost(w)):`<b>${lab(w)}</b>`}${tb?'':`${C.ab?`<span><input type="checkbox" checked data-a="${i}" onchange="const w=this.closest('.wrow');w.classList.toggle('no',!!w.querySelector('input:not(:checked)'))">到場</span>`:''}${C.vd?`<span><input type="checkbox" checked data-v="${i}" onchange="const w=this.closest('.wrow');w.classList.toggle('no',!!w.querySelector('input:not(:checked)'))">有效</span>`:''}`}</label>`).join('')}</div>${tb?'<p class="hn">桌獎：全場該座位號皆為得獎</p>':''}<button id="okb" class="big">領獎確認</button></div>`);
SF.win();burst();$('#okb').focus();
$('#okb').onclick=()=>{const v=ws.map((_,i)=>{const a=$(`[data-a="${i}"]`),b=$(`[data-v="${i}"]`);return a&&!a.checked?1:b&&!b.checked?2:0});M();r(v)}})}
function startChk(p){let r=false;if(p.si<0&&p.rs&&!p.rsd){p.rsd=1;r=true}if(r){S.pool=full();S.seat=seats();S.segG=S.segT=false}}
function fin(p){p.done=true;S.pool.push(...p.abs);p.abs=[];const k=S.plan.indexOf(p),n=S.plan.findIndex((x,i)=>!x.done&&i>k);S.cur=n>=0?n:S.plan.findIndex(x=>!x.done)}
async function go(){const p=S&&S.cur>=0&&cur();if(busy||!p||!p.ok||p.done)return;busy=1;$('#dr').disabled=true;try{startChk(p);
const T=p.gm==='table',n=p.pm==='seq'?1:p.N-p.got.length-p.void;let ws=[];say(`抽獎中…　${p.no}　${p.pn}`);
if(!(T?S.seat:S.pool).length){toast('名單已抽完');fin(p)}
else if(p.pm==='once'&&n>1){const m=$('#multi');m.className='multi on';m.innerHTML='';for(let i=0;i<n;i++){const w=pick(p,1);if(!w.length)break;await spin(w,p);m.innerHTML+=`<div class="mc"><small>第 ${i+1} 位</small>${cdh(w[0])}</div>`;ws.push(...w)}await settle(p,ws)}
else{ws=pick(p,n);await spin(ws,p);await settle(p,ws)}
MSG=p.done?[`${p.no} 抽獎完成，共 ${p.got.length} 位領獎`,0]:null;save()}catch(err){console.error(err);M();const sv=load();if(sv)S=sv;MSG=['發生錯誤，已還原到上一次存檔的狀態，請再試一次',1]}finally{busy=0}
render()}
async function settle(p,ws){const T=p.gm==='table',tm=new Date().toLocaleTimeString('zh-TW',{hour12:false});
while(ws.length){const ok=await popup(p,ws),miss=[];
ws.forEach((w,i)=>{const R=x=>S.res.push({od:p.od,no:p.no,sn:p.sn,pn:p.pn,gift:p.gift,w:lab(w),st:x,t:tm}),c=ok[i];if(!c){p.got.push(w);R('得獎')}else{const m=c===1?C.abs:C.inv;miss.push({w,m});R((c===1?'不在場':'作廢')+(m==='void'?'（充公）':''))}});
if(T){S.segT=true;if(C.auto&&!C.rep&&C.mode==='table'){const g=ws.map(w=>''+w.v);S.pool=S.pool.filter(id=>!g.includes(id.split('-')[1]))}}else S.segG=true;
if(C.rep)ws.forEach((w,i)=>{if(!ok[i])(T?S.seat:S.pool).push(w.v)});
ws=[];if(!miss.length)break;
const vd=miss.filter(x=>x.m==='void'),rd=miss.filter(x=>x.m!=='void');
if(vd.length){back(vd.map(x=>x.w));p.void+=vd.length}
rd.forEach(x=>{if(x.m==='back')back([x.w]);else p.abs.push(x.w.v)});
if(!rd.length)break;
if(S.pool.length){say('有人未到場或作廢，重新抽出補足…');ws=pick(p,rd.length);await spin(ws,p)}}
if(p.got.length+p.void>=p.N||!(T?S.seat:S.pool).length)fin(p)}

function csv(){TX('匯出中獎名單（CSV）','階段,順序,獎項編號,獎項名稱/提供者,獎品名稱,得獎者,狀態,時間\n'+srt(S.res).map(r=>[r.sn,odOf(r),r.no,r.pn,r.gift,r.w,r.st,r.t].map(x=>`"${x}"`).join(',')).join('\n'),'winners.csv')}

function exO(k){fix();M();const d=dstr();
if(k===0)return dl('尾牙抽獎設定_'+d+'.json',JSON.stringify({C,ST},null,2),'application/json;charset=utf-8');

else{const E=new Set(full());if(C.mode==='table'){rows=[['桌次','號次','狀態']];for(let t=1;t<=C.tables;t++)for(let s=1;s<=C.seats;s++)rows.push([t,s,E.has(t+'-'+s)?'有效':'已排除'])}
else{rows=[['編號','狀態']];for(let n=1;n<=C.total;n++)rows.push([n,E.has(''+n)?'有效':'已排除'])}}

const rows=[['階段','順序','獎項編號','獎項名稱/提供者','獎品名稱','每次抽出']];ST.forEach(s=>s.prizes.forEach((p,j)=>rows.push([s.name,j+1,p.no,p.name,p.gift,p.per])));

if(S&&S.res.length&&!await ask('匯入設定會清除目前的抽獎進度與結果，是否繼續？'))return;
const oc=C,os=ST;try{C={...DC,...d.C};ST=d.ST;mig();fix()}catch(e){C=oc;ST=os;return toast('格式錯誤，無法匯入')}
S=null;UL=false;save();M();V='set';render();toast('已匯入設定')},'.json,application/json,.txt')}
